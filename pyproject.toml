[project]
name = "ddtrace-api"
version = "0.0.1"
description = "The public API of the dd-trace libraries"
authors = [
    { name = "Datadog, Inc.", email = "package@datadoghq.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
readme = "README.md"
license = "Apache-2.0"
keywords = ["datadog", "tracing", "apm", "ddtrace", "observability"]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "hatch == 1.18.0",
    "pdoc == 14.7.0",
]

[project.urls]
Homepage = "https://www.datadoghq.com"
Repository = "https://github.com/DataDog/dd-trace-api-py"
"Bug Tracker" = "https://github.com/DataDog/dd-trace-api-py/issues"
Changelog = "https://github.com/DataDog/dd-trace-api-py/releases"

[tool.black]
line-length = 120
target_version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '''\.py[ix]?$'''
exclude = '''
(
  .venv*
  | \.riot/
  | \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | venv
  | build/
  | dist/
)
'''
